services:
 postgres:
  image: postgres:17
  container_name: mcp-postgres
  environment:
   POSTGRES_DB: mcp_demo
   POSTGRES_USER: mcp_user
   POSTGRES_PASSWORD: mcp_password
  ports:
   - "5432:5432"
  volumes:
   - mcp-postgres-data:/var/lib/postgresql/data
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U mcp_user -d mcp_demo"]
   interval: 5s
   timeout: 3s
   retries: 20
volumes:
 mcp-postgres-data:
